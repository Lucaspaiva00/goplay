<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Confirmar Presença – GoPlay</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/goplay_home.css"><link rel="stylesheet" href="../css/fase4-horarios.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body>
<aside id="sidebar" class="sidebar"><div class="logo-area"><h2>GoPlay</h2></div><ul id="menuDynamic"></ul></aside><div id="overlay" class="overlay"></div><header class="topbar"><button id="menuBtn" class="menu-btn"><i class="fa fa-bars"></i></button><h1 class="title">Confirmação do Jogo</h1></header>
<main class="content"><section id="encontroHero" class="phase4-hero"><div><h2>Carregando...</h2><p></p></div></section><section id="votoBox" class="p4-card" style="margin-bottom:16px"><h3>Você vai jogar?</h3><div class="presence-actions"><button id="btnVou" class="presence-vote yes">👍 Vou</button><button id="btnNaoVou" class="presence-vote no">👎 Não vou</button></div></section><section class="presence-summary" style="margin-bottom:16px"><div class="presence-stat"><span>👍 Vão</span><strong id="countVou">0</strong></div><div class="presence-stat"><span>👎 Não vão</span><strong id="countNao">0</strong></div><div class="presence-stat"><span>⏳ Pendentes</span><strong id="countPend">0</strong></div><div class="presence-stat"><span>👥 Grupo</span><strong id="countTotal">0</strong></div></section><div class="p4-grid"><section class="p4-card"><h3>Valor do jogo</h3><div id="valorBox"></div></section><section class="p4-card"><h3>Local</h3><div id="localBox"></div></section><section class="p4-card"><h3>Organizador</h3><div id="organizadorBox"></div></section></div><section class="p4-section p4-card"><div class="p4-section-head"><h3>Lista de presença</h3><div id="manageActions" class="phase4-actions" style="display:none"><button id="btnLembrar" class="p4-btn p4-secondary">🔔 Lembrar pendentes</button><button id="btnRateio" class="p4-btn p4-primary">Dividir valor</button></div></div><div id="presencasLista" class="p4-list"></div></section></main>
<script src="../scripts/session.js"></script><script src="../js/goplay_home.js"></script><script src="../scripts/menu.js"></script><script src="../scripts/confirmar-presenca.js"></script></body></html>
