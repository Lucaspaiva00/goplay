<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partida ao vivo — GoPlay</title><link rel="stylesheet" href="../css/jogo-live.css"></head><body>
<main class="live-page">
  <div class="live-top"><button class="live-back" id="btnVoltar">← Voltar</button><div class="live-title"><h1 id="campeonatoNome">Partida</h1><small id="empresaNome">GoPlay</small></div><span class="live-status" id="statusBadge">AGENDADO</span></div>
  <section class="scoreboard">
    <div class="score-meta"><span class="periodo" id="periodo">1º tempo</span><span class="clock" id="clock">00:00</span></div>
    <div class="score-grid"><div class="team"><div class="team-name" id="timeA">Time A</div></div><div class="score" id="placar">0 × 0</div><div class="team"><div class="team-name" id="timeB">Time B</div></div></div>
    <div class="penaltis" id="penaltis" style="display:none"></div>
  </section>
  <div class="realtime-note" id="realtimeNote">Conectando às atualizações em tempo real…</div>
  <div class="live-grid">
    <section class="card"><h2>🕒 Linha do tempo</h2><div class="timeline" id="timeline"><div class="empty">Carregando…</div></div></section>
    <section class="card"><h2>📊 Estatísticas</h2><div id="stats"></div></section>
    <section class="card" style="grid-column:1/-1"><h2>👥 Escalações</h2><div class="lineups" id="lineups"></div></section>
  </div>
</main>    <script src="../scripts/session.js"></script>
<script src="../scripts/jogoDetalhe.js"></script></body></html>
