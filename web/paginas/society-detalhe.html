<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Perfil da Society – GoPlay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/goplay_home.css">
    <link id="communityStyles" rel="stylesheet" href="../css/comunidade.css?v=20261009-perfil">
    <link rel="stylesheet" href="../css/society-detalhe.css?v=20261009-perfil">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../css/comunidade-social.css?v=20261009-social">
</head>

<body>

    <aside id="sidebar" class="sidebar">
        <div class="logo-area">
            <h2>GoPlay</h2>
        </div>
        <ul id="menuDynamic"></ul>
    </aside>

    <div id="overlay" class="overlay"></div>

    <header class="topbar">
        <button id="menuBtn" class="menu-btn">
            <i class="fa fa-bars"></i>
        </button>
    </header>

    <main class="content">

        <div class="society-profile-page">
          <div id="societyInfo" class="society-profile-card" aria-live="polite">Carregando perfil…</div>
          <nav class="society-profile-tabs" role="tablist" aria-label="Conteúdo da Society">
          <button type="button" role="tab" data-profile-tab="partidas" aria-selected="true" aria-controls="panel-partidas" id="tab-partidas">Feed de partidas</button><button type="button" role="tab" data-profile-tab="jogadores" aria-selected="false" aria-controls="panel-jogadores" id="tab-jogadores">Jogadores</button><button type="button" role="tab" data-profile-tab="times" aria-selected="false" aria-controls="panel-times" id="tab-times">Times</button><button type="button" role="tab" data-profile-tab="quadras" aria-selected="false" aria-controls="panel-quadras" id="tab-quadras">Quadras</button><button type="button" role="tab" data-profile-tab="sobre" aria-selected="false" aria-controls="panel-sobre" id="tab-sobre">Sobre</button></nav>
          <div class="society-profile-panels">
          <section role="tabpanel" id="panel-partidas" aria-labelledby="tab-partidas" data-profile-panel="partidas" ><div id="profileFeed" class=""></div></section><section role="tabpanel" id="panel-jogadores" aria-labelledby="tab-jogadores" data-profile-panel="jogadores" hidden><div id="profileJogadores" class="society-member-grid"></div></section><section role="tabpanel" id="panel-times" aria-labelledby="tab-times" data-profile-panel="times" hidden><div id="profileTimes" class="society-member-grid"></div></section><section role="tabpanel" id="panel-quadras" aria-labelledby="tab-quadras" data-profile-panel="quadras" hidden><div id="profileQuadras" class="society-court-grid"></div></section><section role="tabpanel" id="panel-sobre" aria-labelledby="tab-sobre" data-profile-panel="sobre" hidden><div id="profileSobre" class=""></div></section></div>
        </div>

    </main>

    <div id="editModalOverlay" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Editar Empresa</h3>
                <button class="modal-close" onclick="cancelarEdicaoSociety()">
                    <i class="fa fa-times"></i>
                </button>
            </div>

            <div class="modal-body">
                <div class="society-form-grid">
                    <input id="editNome" class="input" placeholder="Nome da Empresa">
                    <input id="editTelefone" class="input" placeholder="Telefone">
                    <input id="editWhatsapp" class="input" placeholder="WhatsApp">
                    <input id="editEmail" class="input" placeholder="E-mail">
                    <input id="editWebsite" class="input" placeholder="Website">
                    <input id="editInstagram" class="input" placeholder="Instagram">
                    <input id="editFacebook" class="input" placeholder="Facebook">
                    <input id="editYoutube" class="input" placeholder="YouTube">
                    <input id="editCep" class="input" placeholder="CEP">
                    <input id="editEndereco" class="input" placeholder="Endereço">
                    <input id="editCidade" class="input" placeholder="Cidade">
                    <input id="editEstado" class="input" placeholder="Estado">
                    <input id="editPixTitular" class="input" placeholder="Nome do titular do PIX">
                    <input id="editPixChave" class="input" placeholder="Chave PIX">
                </div>

                <textarea id="editDescricao" class="textarea" placeholder="Descrição da Empresa"></textarea>

                <div class="hours-config">
                    <div class="hours-config-head">
                        <div><strong>Horário de funcionamento</strong><small>Defina os dias e horários em que a empresa recebe reservas.</small></div>
                    </div>
                    <div id="editHorariosFuncionamento"></div>
                </div>

                <label class="label" for="editImagem">Nova imagem (opcional)</label>
                <input id="editImagem" class="input" type="file" accept="image/*">
            </div>

            <div class="modal-footer">
                <button class="btn green" onclick="salvarEdicaoSociety()">Salvar Alterações</button>
                <button class="btn navy" onclick="cancelarEdicaoSociety()">Cancelar</button>
            </div>
        </div>
    </div>

        <script src="../scripts/session.js"></script>
<script src="../js/goplay_home.js?v=20261009-social"></script>
    <script src="../scripts/uploadCloudinary.js"></script>
    <script src="../scripts/partidas-feed.js?v=20261009-social"></script>
    <script src="../scripts/societyDetalhe.js?v=20261009-social"></script>
    <script src="../scripts/menu.js?v=20261009-esporte"></script>

</body>

</html>
