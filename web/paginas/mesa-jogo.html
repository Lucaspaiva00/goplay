<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesa de Jogo — GoPlay</title><link rel="stylesheet" href="../css/mesa-jogo.css"></head><body><main class="mesa">
<div class="mesa-head"><div><h1>Mesa de Jogo</h1><div class="mesario" id="mesarioNome">Validando acesso…</div></div><span class="pill" id="status">AGENDADO</span></div><div class="message" id="msg"></div>
<section class="placar-card"><div class="cronometro"><span class="periodo" id="periodo">1º tempo</span><span class="clock" id="clock">00:00</span></div><div class="score-grid"><div class="team-name" id="timeA">Time A</div><div class="score" id="placar">0 × 0</div><div class="team-name" id="timeB">Time B</div></div><div class="controls"><button class="btn btn-green" id="btnIniciar">▶ Iniciar</button><button class="btn btn-light" id="btnPausar">⏸ Pausar</button><button class="btn btn-amber" id="btnIntervalo">Intervalo</button><button class="btn btn-green" id="btnSegundoTempo">2º tempo</button><button class="btn btn-red" id="btnEncerrar">🏁 Encerrar partida</button><button class="btn btn-light" id="btnSumula" style="display:none">📄 Súmula PDF</button></div></section>
<div class="mesa-grid">
<section class="card"><h2>Registrar evento</h2><div class="team-pick"><button class="team-btn active" id="pickA"></button><button class="team-btn" id="pickB"></button></div><select class="select" id="jogador"><option value="">Selecione o jogador</option></select><small class="muted" style="display:block;margin-top:6px">Gol, cartões, chute, chute no gol e falta exigem jogador.</small><div class="quick-grid" id="quick"></div><div class="danger-row"><button class="btn btn-light" id="btnSub">🔄 Substituição</button><button class="btn btn-light" id="btnObs">📝 Observação</button><button class="btn btn-red" id="btnUndo">↩ Desfazer último</button></div><div class="stats-mini" id="statsMini"></div></section>
<section class="card"><h2>Linha do tempo</h2><div class="timeline" id="timeline"></div></section>
<section class="card" style="grid-column:1/-1"><h2>Escalação</h2><div class="lineups" id="lineups"></div></section>
</div></main>
<div class="modal" id="subModal"><div class="modal-box"><h3>Substituição</h3><select class="input" id="jogadorSai"></select><select class="input" id="jogadorEntra"></select><div class="modal-actions"><button class="btn btn-light" data-close>Cancelar</button><button class="btn btn-green" id="confirmSub">Confirmar</button></div></div></div>
<div class="modal" id="obsModal"><div class="modal-box"><h3>Observação da partida</h3><textarea class="input" id="obsTexto" rows="4" placeholder="Ex.: atendimento médico, paralisação..."></textarea><div class="modal-actions"><button class="btn btn-light" data-close>Cancelar</button><button class="btn btn-green" id="confirmObs">Registrar</button></div></div></div>
    <script src="../scripts/session.js"></script>
<script src="../scripts/mesaJogo.js?v=20261007-1720"></script></body></html>
