<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoPlay — Caixa & Bar</title><link rel="stylesheet" href="../css/goplay_home.css"><link rel="stylesheet" href="../css/fase3-operacao.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body>
<aside id="sidebar" class="sidebar"><div class="logo-area"><h2>GoPlay</h2></div><ul id="menuDynamic"></ul></aside><div id="overlay" class="overlay"></div><header class="topbar"><button id="menuBtn" class="menu-btn"><i class="fa fa-bars"></i></button><h1 class="title">Caixa & Bar</h1></header>
<main class="content"><div class="f3-wrap"><section class="f3-hero"><div><h2>Operação de comandas</h2><p id="perfilOperacao">Carregando perfil...</p></div><button class="f3-btn light" onclick="carregarTudo()"><i class="fa fa-rotate"></i> Atualizar</button></section>
<div class="f3-grid"><div class="f3-kpi"><span>Abertas</span><strong id="cxAbertas">0</strong></div><div class="f3-kpi"><span>Aguardando pagamento</span><strong id="cxFechadas">0</strong></div><div class="f3-kpi"><span>Pagas hoje</span><strong id="cxPagas">0</strong></div><div class="f3-kpi"><span>Em aberto</span><strong id="cxValor">R$ 0</strong></div></div>
<section class="f3-two"><div class="f3-card"><h3>Comandas</h3><div class="f3-actions" style="margin-bottom:12px"><button class="f3-btn light" onclick="setFiltro('')">Todas</button><button class="f3-btn light" onclick="setFiltro('ABERTA')">Abertas</button><button class="f3-btn light" onclick="setFiltro('FECHADA')">Pagamento</button></div><div id="cxLista" class="f3-list"></div></div><div class="f3-card"><h3 id="cxDetalheTitulo">Selecione uma comanda</h3><div id="cxDetalhe"><div class="f3-empty">Escolha uma comanda para operar.</div></div></div></section></div></main>
<script src="../scripts/session.js"></script><script src="../js/goplay_home.js"></script><script src="../scripts/menu.js"></script><script src="../scripts/caixa-bar.js"></script></body></html>
