<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Meus Horários – GoPlay</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/goplay_home.css"><link rel="stylesheet" href="../css/fase4-horarios.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body>
<aside id="sidebar" class="sidebar"><div class="logo-area"><h2>GoPlay</h2></div><ul id="menuDynamic"></ul></aside><div id="overlay" class="overlay"></div>
<header class="topbar"><button id="menuBtn" class="menu-btn"><i class="fa fa-bars"></i></button><h1 class="title">Meus Horários</h1></header>
<main class="content"><section class="phase4-hero"><div><h2>⚽ Seus jogos recorrentes</h2><p>Confirme presença, organize sua pelada semanal e convide jogadores.</p></div><div class="phase4-actions"><button id="btnNovoGrupo" class="p4-btn p4-primary"><i class="fa fa-plus"></i> Novo grupo</button></div></section>
<section class="p4-card" style="margin-bottom:16px"><div class="p4-section-head"><div><h3>Disponível para completar jogos</h3><div class="p4-muted">Quando ativado, organizadores podem encontrar você para preencher vagas.</div></div><label style="display:flex;align-items:center;gap:8px;font-weight:900;color:#052845"><input id="toggleDisponivel" type="checkbox"> Estou disponível</label></div></section>
<div id="gruposLista" class="p4-grid"></div></main>
<div id="modalNovoGrupo" class="p4-modal"><div class="p4-modal-box"><div class="p4-section-head"><h3>Novo grupo de jogo</h3><button id="fecharNovoGrupo" class="p4-btn p4-secondary">Fechar</button></div><form id="formNovoGrupo" class="p4-form"><div class="p4-field"><label>Empresa / arena</label><select id="grupoSocietyId" required></select></div><div class="p4-form two"><div class="p4-field"><label>Nome do grupo</label><input id="grupoNome" placeholder="Ex.: Segunda dos Amigos" required></div><div class="p4-field"><label>Máximo de jogadores</label><input id="grupoMax" type="number" min="2" max="100" value="20"></div></div><div class="p4-field"><label>Descrição</label><textarea id="grupoDescricao" placeholder="Turma que joga toda segunda-feira..."></textarea></div><button class="p4-btn p4-primary" type="submit">Criar grupo</button></form></div></div>
<script src="../scripts/session.js"></script><script src="../js/goplay_home.js"></script><script src="../scripts/menu.js"></script><script src="../scripts/meus-horarios.js"></script></body></html>
