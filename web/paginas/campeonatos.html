<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonatos – GoPlay</title>

    <link rel="stylesheet" href="../css/goplay_home.css">
    <link rel="stylesheet" href="../css/campeonatos.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <h2>GoPlay</h2>
        </div>

        <ul id="menuDynamic"></ul>
    </aside>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay"></div>

    <!-- TOPBAR -->
    <header class="topbar">

        <button class="menu-btn" id="menuBtn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <h1 class="title">
            <i class="fa-solid fa-trophy"></i>
            Campeonatos
        </h1>

    </header>

    <!-- CONTENT -->
    <div class="main-wrapper">

        <main class="content">

            <!-- HERO -->
            <section class="hero-campeonatos">

                <div class="hero-left">

                    <span class="hero-chip">
                        <i class="fa-solid fa-shield-halved"></i>
                        Sistema oficial GoPlay
                    </span>

                    <h1>
                        Gerencie Campeonatos
                    </h1>


                    <button class="btn-criar" onclick="location.href='campeonato-create.html'">

                        <i class="fa-solid fa-plus"></i>
                        Criar campeonato

                    </button>

                </div>

                <div class="hero-right">

                    <div class="hero-stat">
                        <strong id="totalCampeonatos">0</strong>
                        <span>Campeonatos</span>
                    </div>

                    <div class="hero-stat">
                        <strong>4</strong>
                        <span>Times por Grupo</span>
                    </div>

                    <div class="hero-stat">
                        <span>Jogos automáticos</span>
                    </div>

                </div>

            </section>

            <!-- LISTA -->
            <section class="lista-section">

                <div class="section-header">

                    <div>
                        <h2>
                            <i class="fa-solid fa-layer-group"></i>
                            Suas ligas
                        </h2>

                        <p>
                            Campeonatos cadastrados na sua society
                        </p>
                    </div>

                </div>

                <div id="listaCampeonatos" class="campeonatos-grid">

                    <div class="loading-card">
                        Carregando campeonatos...
                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="../scripts/menu.js"></script>
    <script src="../scripts/campeonatos.js"></script>

</body>

</html>
